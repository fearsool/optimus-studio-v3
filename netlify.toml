[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_USE_NETLIFY_EDGE = "true"
  # Note: Environment variables like HUGGINGFACE_API_TOKEN 
  # must be set in the Netlify UI for security.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
